<html class="staticrypt-html">

        <meta charset="utf-8" />

        <meta http-equiv="cache-control" content="no-cache" />

        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FFFCF5;--surface:#FFFFFF;--surface-2:#F7F1E3;--ink:#2F2E33;--text:#4A4850;--muted:#86838C;--line:#ECE4D0;--line-strong:#B5B0A6;--cta:#F7C04A;--cta-ink:#2F2E33;--focus:#3F78C4;--warn-soft:#FFF3D1;--warn-line:#EBD08A;--warn-ink:#6B4A00;--err:#B3402B;--err-soft:#FDECE7;--font:"Libre Franklin",system-ui,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1C1B1E;--surface:#26252A;--surface-2:#302F35;--ink:#F4F2EE;--text:#DDDAD4;--muted:#A9A6AF;--line:#3B3A40;--line-strong:#77747D;--focus:#8DB6EE;--warn-soft:#3A3314;--warn-line:#6B5A20;--warn-ink:#FFD98A;--err:#F29B88;--err-soft:#3A2420;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
.hidden{display:none!important}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--cta);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.brand-name{font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.01em}
.pill{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:999px;padding:2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(22px,5vw,32px);display:flex;flex-direction:column;gap:18px}
.lock{width:56px;height:56px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
h1{margin:0;color:var(--ink);font-size:clamp(26px,6vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);font-size:16px}
form{display:flex;flex-direction:column;gap:14px;margin:0}
label.field{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pw{position:relative}
.pw input{width:100%;min-height:52px;padding:0 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.pw input:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.pw.bad input{border-color:var(--err)}
.toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.7}
.toggle:hover{opacity:1;background:var(--surface-2)}
.toggle:focus-visible{outline:3px solid var(--focus)}
.toggle img{width:20px;height:20px;display:block}
@media (prefers-color-scheme:dark){.toggle img{filter:invert(1)}}
.err{background:var(--err-soft);color:var(--err);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.remember{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text);cursor:pointer}
.remember input{width:18px;height:18px;accent-color:var(--cta);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;border:1px solid var(--cta);background:var(--cta);color:var(--cta-ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.foot{text-align:center;font-size:14px;color:var(--muted)}
</style>
</head>
